<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Local ELEKS Ambiguous Result Fixture</title></head>
<body>
  <form id="application" action="#" method="post" enctype="multipart/form-data">
    <label for="full_name">Full Name</label><input id="full_name" name="full_name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="phone">Phone</label><input id="phone" name="phone" type="tel" required>
    <label for="resume">Attach a CV</label><input id="resume" name="resume" type="file" required>
    <label for="updates">Get updated about new vacancies at ELEKS</label><input id="updates" name="updates" type="checkbox">
    <label for="message">Message</label><textarea id="message" name="message"></textarea>
    <button id="final-submit" type="submit">Submit application</button>
  </form>
  <script>
    document.querySelector('#application').addEventListener('submit', event => {
      event.preventDefault();
      window.location.href = 'eleks_no_confirmation_result.html';
    });
  </script>
</body>
</html>
