<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Local Application Fixture</title></head>
<body>
  <form id="application" action="#" method="post" enctype="multipart/form-data">
    <label for="full_name">Full Name</label>
    <input id="full_name" name="full_name" type="text" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" required>
    <label for="resume">Attach a CV</label>
    <input id="resume" name="resume" type="file" accept=".pdf">
    <label for="message">Message</label>
    <textarea id="message" name="message"></textarea>
    <label for="updates">Get updated about new vacancies at ELEKS</label>
    <input id="updates" name="updates" type="checkbox">
    <button id="test-submit" type="button">Submit test form</button>
    <button id="native-submit" type="submit">Submit application</button>
  </form>
  <p id="result" role="status" hidden></p>
  <script>
    document.querySelector('#test-submit').addEventListener('click', () => {
      const result = document.querySelector('#result');
      result.textContent = 'Local fixture received';
      result.hidden = false;
    });
  </script>
</body>
</html>
